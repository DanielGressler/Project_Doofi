name: P1 local validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run db:verify-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-validation
          path: |
            playwright-report/
            docs/evidencias/*.png
          retention-days: 7
